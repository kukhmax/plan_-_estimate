name: plan-estimate

services:
  postgres:
    image: postgres:16-alpine
    container_name: plan_estimate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plan_estimate_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      APP_ENV: production
      DEBUG: "false"

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-86400}
      MOCK_TELEGRAM_AUTH: "false"

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}

      # Media storage / photos (Stage 14). Backend only. Defaults keep media
      # disabled and uploads off when .env.production has no media entries.
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-disabled}
      MEDIA_STORAGE_NAME: ${MEDIA_STORAGE_NAME:-r2-primary}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      PHOTO_UPLOADS_ENABLED: ${PHOTO_UPLOADS_ENABLED:-false}
      PHOTO_SIGNED_URL_TTL_SECONDS: ${PHOTO_SIGNED_URL_TTL_SECONDS:-300}
      PHOTO_MAX_UPLOAD_BYTES: ${PHOTO_MAX_UPLOAD_BYTES:-25000000}
      PHOTO_MAX_DECODED_PIXELS: ${PHOTO_MAX_DECODED_PIXELS:-60000000}
      PHOTO_STORAGE_WARNING_BYTES: ${PHOTO_STORAGE_WARNING_BYTES:-8000000000}
      PHOTO_STORAGE_SOFT_CAP_BYTES: ${PHOTO_STORAGE_SOFT_CAP_BYTES:-10000000000}
      PHOTO_TEMP_DIR: ${PHOTO_TEMP_DIR:-/tmp/plan-estimate-photos}
      PHOTO_TEMP_STALE_AFTER_SECONDS: ${PHOTO_TEMP_STALE_AFTER_SECONDS:-86400}
      PHOTO_PROCESSING_WAIT_SECONDS: ${PHOTO_PROCESSING_WAIT_SECONDS:-30}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: plan_estimate_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: plan_estimate_caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      APP_DOMAIN: ${APP_DOMAIN}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

    networks:
      - internal

volumes:
  postgres_data:
    driver: local

  caddy_data:
    driver: local

  caddy_config:
    driver: local

networks:
  internal:
    driver: bridge
