name: plan-estimate

services:
  postgres:
    image: postgres:16-alpine
    container_name: plan_estimate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plan_estimate_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      APP_ENV: production
      DEBUG: "false"

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-86400}
      MOCK_TELEGRAM_AUTH: "false"

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}

      # Media storage / photos (Stage 14). Backend only. Defaults keep media
      # disabled and uploads off when .env.production has no media entries.
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-disabled}
      MEDIA_STORAGE_NAME: ${MEDIA_STORAGE_NAME:-r2-primary}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      PHOTO_UPLOADS_ENABLED: ${PHOTO_UPLOADS_ENABLED:-false}
      PHOTO_SIGNED_URL_TTL_SECONDS: ${PHOTO_SIGNED_URL_TTL_SECONDS:-300}
      PHOTO_MAX_UPLOAD_BYTES: ${PHOTO_MAX_UPLOAD_BYTES:-25000000}
      PHOTO_MAX_REQUEST_BYTES: ${PHOTO_MAX_REQUEST_BYTES:-27000000}
      PHOTO_MAX_DECODED_PIXELS: ${PHOTO_MAX_DECODED_PIXELS:-60000000}
      PHOTO_STORAGE_WARNING_BYTES: ${PHOTO_STORAGE_WARNING_BYTES:-8000000000}
      PHOTO_STORAGE_SOFT_CAP_BYTES: ${PHOTO_STORAGE_SOFT_CAP_BYTES:-10000000000}
      PHOTO_TEMP_DIR: ${PHOTO_TEMP_DIR:-/tmp/plan-estimate-photos}
      PHOTO_TEMP_STALE_AFTER_SECONDS: ${PHOTO_TEMP_STALE_AFTER_SECONDS:-86400}
      PHOTO_PROCESSING_WAIT_SECONDS: ${PHOTO_PROCESSING_WAIT_SECONDS:-30}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: plan_estimate_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: plan_estimate_caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      APP_DOMAIN: ${APP_DOMAIN}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

    networks:
      - internal

  # Stage 14D backup execution container (docs/STAGE_14D_BACKUP_RESTORE_PLAN.md §16).
  # Profile-gated: `up -d` never starts it. Run one-shot, always with --no-deps
  # (a backup must never start or recreate postgres):
  #   docker compose --env-file .env.production --env-file <backup env> -p plan-estimate \
  #     -f docker-compose.prod.yml run --rm --no-deps backup preflight
  # Variables use fail-closed defaults instead of `${VAR:?}`, because Compose
  # interpolates the whole file and `:?` would break normal deployments: an
  # unset BACKUP_UID runs as nobody (workspace checks fail), an unset
  # BACKUP_HOST_ROOT points at a non-existent path (the bind mount is refused).
  # ONE data mount (<root>/data -> /backup) so work/<run_id> -> encrypted/<run_id>
  # is a single atomic rename (Stage 14D.2D.2, owner decision D1); secrets
  # stay outside the data root and are mounted read-only on their own.
  backup:
    profiles: ["backup"]
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    image: plan-estimate-backup:local
    entrypoint: ["python", "-m", "app.backup"]
    command: ["preflight"]
    user: "${BACKUP_UID:-65534}:${BACKUP_GID:-65534}"
    restart: "no"
    stop_grace_period: 45s
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    environment:
      PGHOST: ${BACKUP_PGHOST:-postgres}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGDATABASE: ${BACKUP_PGDATABASE:-}
      PGUSER: ${BACKUP_PGUSER:-}
      PGSSLMODE: ${BACKUP_PGSSLMODE:-}
      PGPASSFILE: /run/secrets/pgpass
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
    volumes:
      - type: bind
        source: ${BACKUP_HOST_ROOT:-/nonexistent/plan-estimate-backup-root-not-configured}/data
        target: /backup
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_HOST_ROOT:-/nonexistent/plan-estimate-backup-root-not-configured}/secrets/pgpass
        target: /run/secrets/pgpass
        read_only: true
        bind:
          create_host_path: false
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    networks:
      - internal

  # Stage 14D.6A uploader (docs/STAGE_14D_BACKUP_RESTORE_PLAN.md §16.19; design: STAGE_14D3 O2). Profile-gated like
  # `backup`, one-shot, always --no-deps. It is the ONLY service that talks to R2 and Oracle: it has NO database
  # connection, NO pgpass and NO route to PostgreSQL (its only network is the external `pe-upload` bridge, the one
  # network behind the IMDS guard that may reach the instance principal, 14D.4), and the production backend's
  # read-write R2 token is never used: the R2 variables below have their own names (BACKUP_UPLOAD_S3_*) so that
  # `--env-file .env.production` cannot leak MEDIA_S3_* into it. `/backup` is writable because `upload` takes
  # run.lock and writes evidence/<run_id>.published.json there; the artifacts in it are age-encrypted.
  #   docker compose --env-file .env.production --env-file <backup env> --env-file <upload env> -p plan-estimate \
  #     -f docker-compose.prod.yml run --rm --no-deps backup-upload upload --environment production --allow-production
  backup-upload:
    profiles: ["backup-upload"]
    build:
      context: ./backend
      dockerfile: Dockerfile.uploader
      args:
        BACKUP_IMAGE: plan-estimate-backup:local
    image: plan-estimate-backup-upload:local
    entrypoint: ["python", "-m", "app.backup"]
    command: ["upload", "--help"]
    user: "${BACKUP_UID:-65534}:${BACKUP_GID:-65534}"
    restart: "no"
    stop_grace_period: 45s
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    environment:
      MEDIA_S3_ENDPOINT_URL: ${BACKUP_UPLOAD_S3_ENDPOINT_URL:-}
      MEDIA_S3_BUCKET: ${BACKUP_UPLOAD_S3_BUCKET:-}
      MEDIA_S3_REGION: ${BACKUP_UPLOAD_S3_REGION:-auto}
      MEDIA_S3_ACCESS_KEY_ID: ${BACKUP_UPLOAD_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${BACKUP_UPLOAD_S3_SECRET_ACCESS_KEY:-}
      MEDIA_STORAGE_NAME: ${BACKUP_UPLOAD_SOURCE_NAME:-r2-primary}
      BACKUP_OCI_NAMESPACE: ${BACKUP_OCI_NAMESPACE:-}
      BACKUP_OCI_BUCKET: ${BACKUP_OCI_BUCKET:-}
      BACKUP_OCI_REGION: ${BACKUP_OCI_REGION:-eu-frankfurt-1}
      BACKUP_TOOL_COMMIT: ${BACKUP_TOOL_COMMIT:-}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
    volumes:
      - type: bind
        source: ${BACKUP_HOST_ROOT:-/nonexistent/plan-estimate-backup-root-not-configured}/data
        target: /backup
        bind:
          create_host_path: false
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 268435456
    networks:
      - pe-upload

volumes:
  postgres_data:
    driver: local

  caddy_data:
    driver: local

  caddy_config:
    driver: local

networks:
  internal:
    driver: bridge
  # Created by hand in 14D.4 (bridge br-pe-upload, the IMDS guard's allow-list); never created by Compose.
  pe-upload:
    external: true
    name: pe-upload
